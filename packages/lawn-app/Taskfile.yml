version: '3'

includes:
  assets:
    taskfile: ../lawn-assets
    dir: ../lawn-assets
    internal: true

tasks:
  configure:
    cmds:
      - task: configure-ninja
      - task: configure-msvc
  configure-ninja:
    - cmake --preset=windows-x64-debug-msvc -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
  configure-msvc:
    - cmake --preset=windows-x64-debug-msvc -B build-msvc -G "Visual Studio 18 2026"

  build:
    vars:
      NPROC:
        sh: nproc
    cmds:
      - cmake --build build-msvc --config Debug -- /m:{{.NPROC}}

  build-release:
    vars:
      NPROC:
        sh: nproc
    cmds:
      - cmake --build build-msvc --config Release -- /m:{{.NPROC}}

  build-assets:
    - task: assets:build

  run:
    - cd Export && ./LawnProject.exe

  clean:
    - rm -rf build build-msvc Export
