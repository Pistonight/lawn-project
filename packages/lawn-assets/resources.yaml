paths:
  input-directories:
    - ../../target/assets/shared
    - ../../target/assets/mainen
  output-xml: ../../target/assets/shared/properties/resources.xml
  output-cpp: ../resod-framework/src-mixin/LawnApp/Resources.cpp
  excludes:
    - glob:properties/*.txt
    - glob:fonts/**/*
    - glob:shaders/**/*
    # not in the manifest
    - glob:sounds/ZombiesOnYourLawn.ogg
    - glob:sounds/mainmusic.mo3
    - glob:sounds/mainmusic_hihats.mo3
    - glob:images/icesparkle.png
    # name conflict with _?
    - glob:images/blank_.gif
    - glob:images/PvZ_Logo_.png
    - glob:images/sod1row_.png
    - glob:images/sod3row_.png
    - glob:images/Store_Car_.png
    - glob:images/Store_CarClosed_.png
    - glob:images/Tombstones_.png
    # bad decisions cause conflicts
    - glob:images/Credits_ZombieNote.png
    - glob:images/ZombieNote*
    - glob:images/ZombieFinalNote*
    - glob:images/Zombiefinalnote*



codegen:
  include-prefix: LawnApp

resource-groups:
  - name: Init
    contents:
      - type: Image
        defaults: { path: images, id-prefix: IMAGE_ }
        items:
          - { path: blank, id: BLANK, external: true }
          - path: PopCap_Logo.jpg

      - type: Image
        defaults: { path: properties, id-prefix: IMAGE_ }
        items:
          - path: partner_logo.jpg


  - name: LoaderBar
    contents:
      - type: Image
        defaults: { path: images, id-prefix: IMAGE_ }
        items:
          - path: titlescreen.jpg
            attrs: { a8r8g8b8: true }
          - pattern: glob:LoadBar_*.png
          - path: PvZ_Logo.jpg

      - type: Image
        defaults: { path: reanim, id-prefix: IMAGE_REANIM_ }
        items:
          - path: SodRollCap.png

      - type: Font
        defaults: { path: data, id-prefix: FONT_ }
        items:
          - path: BrianneTod16.txt
          - path: BrianneTod16ZH.txt

      - type: Sound
        defaults: { path: sounds, id-prefix: SOUND_ }
        items:
          - path: buttonclick.ogg
          - pattern: glob:loadingbar_*


  - name: LoadingSounds
    contents:
      - type: Sound
        defaults: { path: sounds, id-prefix: SOUND_ }
        items:
          - path: hugewave.ogg
            id: HUGE_WAVE
          - path: slotmachine.ogg
            id: SLOT_MACHINE
          - pattern: glob:*


  - name: DelayLoad_Background1
    contents: [] # preloaded
  - name: DelayLoad_BackgroundUnsodded
    contents: [] # preloaded
  - name: DelayLoad_Background2
    contents: [] # preloaded
  - name: DelayLoad_Background3
    contents: [] # preloaded
  - name: DelayLoad_Background4
    contents: [] # preloaded
  - name: DelayLoad_Background5
    contents: [] # preloaded
  - name: DelayLoad_Background6
    contents: [] # preloaded
  - name: DelayLoad_MushroomGarden
    contents: [] # preloaded
  - name: DelayLoad_GreenHouseGarden
    contents: [] # preloaded
  - name: DelayLoad_GreenHouseOverlay
    contents: [] # preloaded
  - name: DelayLoad_Zombiquarium
    contents: [] # preloaded
  - name: DelayLoad_TreeOfWisdom
    contents: []
  - name: DelayLoad_AwardScreen
    contents: [] # preloaded
  - name: DelayLoad_ChallengeScreen
    contents: [] # preloaded
  - name: DelayLoad_Almanac
    contents: [] # preloaded
  - name: DelayLoad_Store
    contents: [] # preloaded
  - name: DelayLoad_ZombieNote
    contents: [] # preloaded
  - name: DelayLoad_ZombieNote1
    contents: [] # preloaded
  - name: DelayLoad_ZombieNote2
    contents: [] # preloaded
  - name: DelayLoad_ZombieNote3
    contents: [] # preloaded
  - name: DelayLoad_ZombieNote4
    contents: [] # preloaded
  - name: DelayLoad_ZombieFinalNote
    contents: [] # preloaded
  - name: DelayLoad_ZombieNoteHelp
    contents: [] # preloaded


  - name: DelayLoad_Credits
    contents:
      - type: Image
        defaults: { path: reanim, id-prefix: IMAGE_REANIM_ }
        items:
          - pattern: glob:SunFlower_head_*
          - path: Credits_DiscoLights.png
          - path: Credits_fogmachine.png
      - type: Font
        defaults: { path: data, id-prefix: FONT_ }
        items:
          - path: BrianneTod32.txt
          - path: BrianneTod32ZH.txt
          - path: BrianneTod32Black.txt
          - path: BrianneTod32BlackZH.txt

  - name: DelayLoad_Zombatar
    contents:
      - type: Image
        defaults: { path: images, id-prefix: IMAGE_ }
        items:
          - path: zombatar_fhair_button.png
            id: ZOMBATAR_FACIAL_HAIR_BUTTON
          - path: zombatar_fhair_button_highlight.png
            id: ZOMBATAR_FACIAL_HAIR_BUTTON_HIGHLIGHT
          - path: zombatar_fhair_button_over.png
            id: ZOMBATAR_FACIAL_HAIR_BUTTON_OVER
          - pattern: regex:zombatar_.*[^_]\.png


  - name: LoadingFontsZHShare
    contents:
      - type: Font
        defaults: { path: data, id-prefix: FONT_ }
        items:
          - path: DwarvenTodcraft12ZH.txt
          - path: HouseofTerror16ZH.txt

  - name: LoadingFontsZH
    contents:
      - type: Font
        defaults: { path: data, id-prefix: FONT_ }
        items:
          - pattern: glob:*ZH.txt


  - name: LoadingFonts
    # note: there aren't many non-delay fonts so we preload them all to save some headaches
    #       we also removed IMAGE_HOUSEOFTERROR28 since that doesn't seem used
    contents:
      - type: Font
        defaults: { path: data, id-prefix: FONT_ }
        items:
          - { path: Pix118Bold.txt, id: TINYBOLD }
          - { path: ContinuumBold14outback.txt, id: CONTINUUMBOLD14OUTLINE }
          - pattern: glob:*.txt


  - name: LoadingImages
    contents:
      # A8R8G8B8
      - type: Image
        defaults: { path: images, id-prefix: IMAGE_ }
        attrs:
          a8r8g8b8: true
        items:
          - path: Almanac_IndexBack.jpg
          - path: aquarium1.jpg
          - path: AwardScreen_Back.jpg
          - pattern: glob:background*.jpg
            attrs: { ddsurface: true }
          - path: Challenge_Background.jpg
      # minsubdivide
      - type: Image
        defaults: { path: images, id-prefix: IMAGE_ }
        attrs:
          minsubdivide: true
        items:
          - path: FlagMeter.png
            attrs: { rows: 2 }
          - pattern: glob:plantshadow*
          - path: pool.jpg
          - path: pool_base.jpg
          - path: pool_base_night.jpg
            attrs:
              alphagrid: pool_base_.png
          - path: pool_caustic_effect.jpg
            attrs: { nopal: true }
          - path: pool_night.jpg
          - path: pool_shading.jpg
          - path: pool_shading_night.jpg
            attrs:
              alphagrid: pool_shading_.jpg
          - path: SeedBank.png
      # external and ID mismatches
      - type: Image
        defaults: { path: images, id-prefix: IMAGE_ }
        items:
          - path: Achievements_pedestal.png
            id: SELECTORSCREEN_ACHIEVEMENTS_PEDESTAL
          - path: Achievements_pedestal_press.png
            id: SELECTORSCREEN_ACHIEVEMENTS_PEDESTAL_PRESS
          - path: Credits_ZombieNoteBlack
            id: CREDITS_ZOMBIENOTE
            attrs:
              alphagrid: Credits_ZombieNote
            external: true
          - path: selector_morewaystoplay_background.png
            id: SELECTORSCREEN_MOREWAYSTOPLAY_BG
          - id: ZOMBIE_NOTE
            path: ZombieNote
            external: true
          - path: ZombieNoteSmall
            id: ZOMBIE_NOTE_SMALL
            external: true
          - id: ZOMBIE_NOTE1
            path: ZombieNoteBlack1
            attrs: { alphagrid: ZombieNote1 }
            external: true
          - id: ZOMBIE_NOTE2
            path: ZombieNoteBlack2
            attrs: { alphagrid: ZombieNote2 }
            external: true
          - id: ZOMBIE_NOTE3
