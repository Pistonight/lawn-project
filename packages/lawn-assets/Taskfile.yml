version: '3'

tasks:
  build:
    sources:
      - Taskfile.yml
      - resources.yaml
      - 'shaders/**/*'
      - 'scripts/**/*'
      - 'mod/**/*'
      - 'framework/**/*'
      - ../build-script/src/assetbuild/_cnfont.py
    generates:
      - ../../target/run/mainen.pak
      - ../../target/run/mainzh.pak
      - ../../target/run/shared.pak
    cmds:
      - cd ../build-script && uv run src/main.py assets build

  clean:
    - rm -rf ../../target/assets
    - rm -f ../../target/run/*.pak

  fix-srcdrop:
    - cd ../build-script && uv run src/main.py assets fix

  pak:
    - cd ../build-script && uv run src/main.py assets pak

  font:
    - cd ../build-script && uv run src/main.py assets cnfont
    
