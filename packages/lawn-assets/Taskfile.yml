version: '3'

tasks:
  build:
    sources:
      - Taskfile.yml
      - resources.yaml
      - 'shaders/**/*'
      - 'mod/**/*'
      - 'framework/**/*'
      - ../build-script/src/assetbuild/_cnfont.py
    generates:
      - ../../target/run/mainen.pak
      - ../../target/run/mainzh.pak
      - ../../target/run/main.pak
    cmds:
      - cd ../build-script && uv run src/main.py assets build
      - rm -rf ../../target/run/fresh_compiled

  compile:
    sources:
      - Taskfile.yml
      - resources.yaml
      - 'mod/shared/particles/*'
      - 'mod/shared/reanim/*'
      - 'mod/override/particles/*'
      - 'mod/override/reanim/*'
    cmds:
      - cd ../build-script && uv run src/main.py assets compile

  clean:
    - rm -rf ../../target/assets
    - rm -f ../../target/run/*.pak

  fix-srcdrop:
    - cd ../build-script && uv run src/main.py assets fix

  pak:
    - cd ../build-script && uv run src/main.py assets pak

  font:
    - cd ../build-script && uv run src/main.py assets cnfont
    
