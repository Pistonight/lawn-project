[package]
name = "pvz-pakc"
description = "tool for packing and unpacking .pak"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
cu.workspace = true
cu.features = [ "cli", "derive", "fs" ]
chrono.workspace = true
windows-sys.workspace = true
windows-sys.features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem"
]
pvz-utils = { path = "../pvz-utils" }
