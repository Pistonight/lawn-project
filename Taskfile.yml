version: '3'

includes:
  common:
    taskfile: mono-dev/task/common.yaml
    optional: true
    flatten: true

  lawn:      { taskfile: packages/lawn,            dir: packages/lawn,            internal: true }
  assets:    { taskfile: packages/lawn-assets,     dir: packages/lawn-assets,     internal: true }
  framework: { taskfile: packages/resod-framework, dir: packages/resod-framework, internal: true }
  lib:       { taskfile: packages/resod-lib,       dir: packages/resod-lib,       internal: true }
  pvz:       { taskfile: packages/pvz-assets,      dir: packages/pvz-assets,      internal: true }

tasks:
  install:
    - rm -rf mono-dev
    - git clone https://github.com/Pistonight/mono-dev --depth 1

  setup:
    - task: pvz:setup

  build:
    - task: assets:build
    - task: lawn:build
    - task: lib:build
    - task: assets:compile

  run:
    - cd target/run && ./PlantsVsZombies.exe

  devenv:
    - task: lawn:devenv

  build-run:
    aliases: [br]
    cmds:
      - task: build
      - task: run

  check:
    - lfmt -c
    - task: lib:check
    - task: framework:check
    - task: lawn:check

  fix:
    - task: lib:fix
    - task: framework:fix
    - task: lawn:fix
    - lfmt

  clean:
    - rm -rf build target/assets target/lawn lawn-assets/.task .task

  nuke:
    - task: clean
    - rm -rf target/run


